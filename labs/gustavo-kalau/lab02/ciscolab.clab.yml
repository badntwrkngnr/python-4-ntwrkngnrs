name: cisco-lab

prefix: ""

topology:
  nodes:
    r1:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:17.18.02
    r2:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:17.18.02
    sw1:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:l2-17.18.02
      type: l2
    sw2:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:l2-17.18.02
      type: l2
    pc1:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.0.13/24 dev eth1
        - ip route add 192.168.1.0/24 via 192.168.0.1 dev eth1
    pc2:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.1.13/24 dev eth1
        - ip route add 192.168.0.0/24 via 192.168.1.1 dev eth1
  links:
    - endpoints: [ "r1:eth1", "r2:eth1" ]
    - endpoints: [ "sw1:eth1", "r1:eth2" ]
    - endpoints: [ "sw1:eth2", "pc1:eth1" ]
    - endpoints: [ "sw2:eth1", "r2:eth2" ]
    - endpoints: [ "sw2:eth2", "pc2:eth1" ]
